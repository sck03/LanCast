[package]
name = "cast-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "lancast_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["sender"]
sender = ["cast-adapters/sender"]
legacy = ["cast-adapters/legacy"]

[dependencies]
cast-adapters = { path = "../crates/cast-adapters", default-features = false }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
tempfile = "3"
