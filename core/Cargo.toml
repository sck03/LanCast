[package]
name = "cast-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "lancast_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["sender"]
sender = ["file-sender", "dlna-live"]
file-sender = ["cast-adapters/file-sender"]
dlna = ["cast-adapters/dlna"]
dlna-live = ["dlna", "cast-adapters/dlna-live"]
file-proxy = ["cast-adapters/file-proxy"]

[dependencies]
cast-adapters = { path = "../crates/cast-adapters", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
serde_json = "1"
