name: Windows
on:
  push:
    branches: [main]
    paths: ["core/**","crates/**","Cargo.*","rust-toolchain.toml","scripts/check-architecture.py","scripts/architecture.py","build-config.json","scripts/build_config.py","scripts/tests/**","windows/**","media-native/**","scripts/build-windows*.ps1","scripts/build-windows.py","scripts/package-windows.ps1","scripts/verify-windows.py","scripts/build-ffmpeg.py","scripts/patch-datachannel.cmake","scripts/package-native-evidence.py","scripts/dependency-report.py","scripts/dependency_inventory.py",".github/workflows/windows.yml"]
  pull_request:
    paths: ["core/**","crates/**","Cargo.*","rust-toolchain.toml","scripts/check-architecture.py","scripts/architecture.py","build-config.json","scripts/build_config.py","scripts/tests/**","windows/**","media-native/**","scripts/build-windows*.ps1","scripts/build-windows.py","scripts/package-windows.ps1","scripts/verify-windows.py","scripts/build-ffmpeg.py","scripts/patch-datachannel.cmake","scripts/package-native-evidence.py","scripts/dependency-report.py","scripts/dependency_inventory.py",".github/workflows/windows.yml"]
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source branch, tag or commit (blank uses the selected workflow ref)'
        type: string
        default: ''
      version:
        description: 'Application major.minor.patch (blank uses build-config.json)'
        type: string
        default: ''
      build_number:
        description: 'Build number 1-65535 (blank uses build-config.json)'
        type: string
        default: ''
      configuration:
        description: 'Application build mode; Release outputs still require production signing'
        type: choice
        options: [Debug, Release]
        default: Release
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}-${{ github.event_name }}-${{ inputs.source_ref }}-${{ inputs.version }}-${{ inputs.build_number }}-${{ inputs.configuration }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Validate product version and record build inputs
        id: build-config
        env:
          LC_VERSION: ${{ inputs.version }}
          LC_BUILD_NUMBER: ${{ inputs.build_number }}
          LC_CONFIGURATION: ${{ inputs.configuration }}
        run: python scripts/build_config.py --platform windows --github
      - name: Test build input validation
        run: python -m unittest discover -s scripts/tests
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v6
        with:
          key: rust-core-windows-2022-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'core/src/**', 'crates/**') }}
          restore-keys: rust-core-windows-2022-
          path: |
            target/
            ~/.cargo/registry/
      - run: python scripts/check-architecture.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo check -p cast-ffi --no-default-features --locked
      - run: cargo check -p cast-ffi --no-default-features --features legacy --locked
      - run: python scripts/dependency-report.py
      - uses: actions/upload-artifact@v7
        with:
          name: dependencies-windows-2022
          path: dist/reports/
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Validate product version and record build inputs
        id: build-config
        env:
          LC_VERSION: ${{ inputs.version }}
          LC_BUILD_NUMBER: ${{ inputs.build_number }}
          LC_CONFIGURATION: ${{ inputs.configuration }}
        run: python scripts/build_config.py --platform windows --github
      - name: Test build input validation
        run: python -m unittest discover -s scripts/tests
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
      - uses: actions/cache/restore@v6
        id: ts-cache
        with:
          key: windows-ts-v1-${{ hashFiles('media-native/**', 'scripts/build-ffmpeg.py') }}
          path: |
            .cache/ffmpeg-windows/
            .cache/ts-windows/
            .cache/ffmpeg-8.0.1.tar.xz
            .cache/ffmpeg-8.0.1/COPYING.LGPLv2.1
      - name: Build minimal Windows TS DLL
        if: steps.ts-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          python scripts/build-ffmpeg.py --prefix .cache/ffmpeg-windows
          cmake -S media-native -B .cache/ts-windows -G Ninja -DFFMPEG_ROOT="$PWD/.cache/ffmpeg-windows" -DCMAKE_BUILD_TYPE=Release
          cmake --build .cache/ts-windows
          ctest --test-dir .cache/ts-windows --output-on-failure
      - uses: actions/cache/save@v6
        if: steps.ts-cache.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.ts-cache.outputs.cache-primary-key }}
          path: |
            .cache/ffmpeg-windows/
            .cache/ts-windows/
            .cache/ffmpeg-8.0.1.tar.xz
            .cache/ffmpeg-8.0.1/COPYING.LGPLv2.1
      - uses: actions/cache/restore@v6
        id: dtls-cache
        with:
          key: windows-dtls-v1-${{ hashFiles('scripts/build-windows-deps.ps1') }}
          path: |
            .cache/mbedtls/
            .cache/mbedtls-install/
      - name: Build pinned DTLS dependency
        if: steps.dtls-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-windows-deps.ps1
      - uses: actions/cache/save@v6
        if: steps.dtls-cache.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.dtls-cache.outputs.cache-primary-key }}
          path: |
            .cache/mbedtls/
            .cache/mbedtls-install/
      - run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/cache@v6
        with:
          key: rust-windows-static-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'core/src/**', 'crates/**') }}
          restore-keys: rust-windows-static-
          path: |
            target/
            ~/.cargo/registry/
      - name: Build test and package Windows application
        run: python scripts/build-windows.py
      - run: python scripts/verify-windows.py
      - run: python scripts/package-native-evidence.py windows
      - uses: actions/upload-artifact@v7
        with:
          name: windows-native-relink-sources
          path: dist/native-evidence/windows/
      - uses: actions/upload-artifact@v7
        with:
          name: LanCast-Windows-x64-${{ steps.build-config.outputs.label }}
          path: dist/LanCast-Windows-x64/
      - uses: actions/upload-artifact@v7
        with:
          name: windows-synthetic-diagnostic-${{ steps.build-config.outputs.label }}
          path: windows/build/${{ steps.build-config.outputs.configuration }}/media_probe.exe
