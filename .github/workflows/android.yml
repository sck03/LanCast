name: Android
on:
  push:
    branches: [main]
    paths: ["core/**","crates/**","Cargo.*","rust-toolchain.toml","scripts/check-architecture.py","build-config.json","scripts/build_config.py","scripts/tests/**","android/**","media-native/**","scripts/build-android*.py","scripts/build-ffmpeg.py","scripts/verify-apks.py","scripts/package-native-evidence.py",".github/workflows/android.yml"]
  pull_request:
    paths: ["core/**","crates/**","Cargo.*","rust-toolchain.toml","scripts/check-architecture.py","build-config.json","scripts/build_config.py","scripts/tests/**","android/**","media-native/**","scripts/build-android*.py","scripts/build-ffmpeg.py","scripts/verify-apks.py","scripts/package-native-evidence.py",".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source branch, tag or commit (blank uses the selected workflow ref)'
        type: string
        default: ''
      version:
        description: 'Application major.minor.patch (blank uses build-config.json)'
        type: string
        default: ''
      build_number:
        description: 'Build number 1-65535 (blank uses build-config.json)'
        type: string
        default: ''
      configuration:
        description: 'Application build mode; Release outputs still require production signing'
        type: choice
        options: [Debug, Release]
        default: Debug
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Validate product version and record build inputs
        id: build-config
        env:
          LC_VERSION: ${{ inputs.version }}
          LC_BUILD_NUMBER: ${{ inputs.build_number }}
          LC_CONFIGURATION: ${{ inputs.configuration }}
        run: python scripts/build_config.py --platform android --github
      - name: Test build input validation
        run: python -m unittest discover -s scripts/tests
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Use runner SDK and install pinned components
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"
      - run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            android/app-*/src/**/jniLibs/
            .cache/ffmpeg-install-*/build-manifest.json
          key: android-native-v1-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', 'core/src/**', 'crates/**', 'media-native/**', 'scripts/build-android-*.py', 'scripts/build-ffmpeg.py') }}
      - name: Build product-specific Rust and minimal TS JNI libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.2.12479018"
          python scripts/build-android-core.py
          python scripts/build-android-media.py
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            android/app-*/src/**/jniLibs/
            .cache/ffmpeg-install-*/build-manifest.json
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Build Kotlin apps lint and verify dependency separation
        run: |
          chmod +x android/gradlew
          python scripts/build-android.py
      - run: python scripts/verify-apks.py
      - run: python scripts/package-native-evidence.py android
      - uses: actions/upload-artifact@v4
        with:
          name: android-native-relink-sources
          path: dist/native-evidence/android/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apks-${{ steps.build-config.outputs.label }}
          path: |
            android/app-*/build/outputs/apk/**/*.apk
            android/app-*/build/reports/
            android/*-dependencies.txt
            dist/reports/build-android.json
            .cache/ffmpeg-install-*/build-manifest.json
