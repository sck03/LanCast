name: Android
on:
  push:
    branches: [main]
    paths: ["core/**","crates/**","Cargo.*","rust-toolchain.toml","scripts/check-architecture.py","android/**","media-native/**","scripts/build-android-*.py","scripts/build-ffmpeg.py","scripts/verify-apks.py","scripts/package-native-evidence.py",".github/workflows/android.yml"]
  pull_request:
    paths: ["core/**","crates/**","Cargo.*","rust-toolchain.toml","scripts/check-architecture.py","android/**","media-native/**","scripts/build-android-*.py","scripts/build-ffmpeg.py","scripts/verify-apks.py","scripts/package-native-evidence.py",".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Use runner SDK and install pinned components
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"
      - run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            android/app-*/src/**/jniLibs/
            .cache/ffmpeg-install-*/build-manifest.json
          key: android-native-v1-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', 'core/src/**', 'crates/**', 'media-native/**', 'scripts/build-android-*.py', 'scripts/build-ffmpeg.py') }}
      - name: Build product-specific Rust and minimal TS JNI libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.2.12479018"
          python scripts/build-android-core.py
          python scripts/build-android-media.py
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            android/app-*/src/**/jniLibs/
            .cache/ffmpeg-install-*/build-manifest.json
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Build Kotlin apps and lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app-receiver:assembleStandardDebug :app-receiver:assembleLegacyDebug :app-sender:assembleDebug :app-receiver:lintStandardDebug :app-receiver:lintLegacyDebug :app-sender:lintDebug :media-webrtc:testDebugUnitTest --stacktrace
      - name: Verify player dependency separation
        working-directory: android
        run: |
          ./gradlew :app-receiver:dependencies --configuration legacyDebugRuntimeClasspath > legacy-dependencies.txt
          ./gradlew :app-receiver:dependencies --configuration standardDebugRuntimeClasspath > standard-dependencies.txt
          if grep -q 'androidx.media3' legacy-dependencies.txt; then exit 1; fi
          grep -q 'media3-common:1.11.1' standard-dependencies.txt
      - run: python scripts/verify-apks.py
      - run: python scripts/package-native-evidence.py android
      - uses: actions/upload-artifact@v4
        with:
          name: android-native-relink-sources
          path: dist/native-evidence/android/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-apks-and-reports
          path: |
            android/app-*/build/outputs/apk/**/*.apk
            android/app-*/build/reports/
            android/*-dependencies.txt
            .cache/ffmpeg-install-*/build-manifest.json
