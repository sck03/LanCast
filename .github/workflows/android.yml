name: Android
on:
  push:
    branches: [main]
    paths: ["core/**","crates/**","Cargo.*","rust-toolchain.toml","scripts/check-architecture.py","scripts/architecture.py","build-config.json","scripts/build_config.py","scripts/tests/**","android/**","airplay-native/**","scripts/package-airplay.py","media-native/**","scripts/build-android*.py","scripts/build-ffmpeg.py","scripts/verify-apks.py","scripts/package-native-evidence.py",".github/workflows/android.yml"]
  pull_request:
    paths: ["core/**","crates/**","Cargo.*","rust-toolchain.toml","scripts/check-architecture.py","scripts/architecture.py","build-config.json","scripts/build_config.py","scripts/tests/**","android/**","airplay-native/**","scripts/package-airplay.py","media-native/**","scripts/build-android*.py","scripts/build-ffmpeg.py","scripts/verify-apks.py","scripts/package-native-evidence.py",".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      source_ref:
        description: '源码版本（选填）：一般留空，使用上方所选分支；编译旧版时填标签或提交号'
        type: string
        default: ''
      version:
        description: '程序版本（选填）：例如 0.4.1；留空使用项目默认值，只填三段数字'
        type: string
        default: ''
      build_number:
        description: '更新序号（选填）：1–65535；留空使用项目默认值，覆盖升级 Android 时需增大'
        type: string
        default: ''
      configuration:
        description: '构建用途：日常使用选 Release，排查问题选 Debug；保留默认即可，不会自动发布'
        type: choice
        options: ['日常使用（Release）', '开发调试（Debug）']
        default: '开发调试（Debug）'
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}-${{ inputs.source_ref }}-${{ inputs.version }}-${{ inputs.build_number }}-${{ inputs.configuration }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Validate product version and record build inputs
        id: build-config
        env:
          LC_VERSION: ${{ inputs.version }}
          LC_BUILD_NUMBER: ${{ inputs.build_number }}
          LC_CONFIGURATION: ${{ inputs.configuration }}
        run: python scripts/build_config.py --platform android --github
      - name: Test build input validation
        run: python -m unittest discover -s scripts/tests
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Use runner SDK and install pinned components
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"
      - run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/cache/restore@v6
        id: native-cache
        with:
          path: |
            android/app-*/src/**/jniLibs/
            android/airplay-receiver/src/main/jniLibs/
            .cache/ffmpeg-install-*/build-manifest.json
          key: android-native-v2-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'airplay-native/Cargo.lock', 'airplay-native/src/**', 'airplay-native/vendor/**', 'rust-toolchain.toml', 'core/src/**', 'crates/**', 'media-native/**', 'scripts/build-android-*.py', 'scripts/build-ffmpeg.py') }}
      - name: Build product-specific Rust and minimal TS JNI libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.2.12479018"
          python scripts/build-android-core.py
          python scripts/build-android-media.py
          python scripts/build-android-airplay.py
      - uses: actions/cache/save@v6
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            android/app-*/src/**/jniLibs/
            android/airplay-receiver/src/main/jniLibs/
            .cache/ffmpeg-install-*/build-manifest.json
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Build Kotlin apps lint and verify dependency separation
        run: |
          chmod +x android/gradlew
          python scripts/build-android.py
      - run: python scripts/verify-apks.py
      - run: python scripts/package-native-evidence.py android
      - run: python scripts/package-airplay.py
      - uses: actions/upload-artifact@v7
        with:
          name: airplay-source-and-dependencies-${{ steps.build-config.outputs.label }}
          path: dist/airplay-evidence/
      - uses: actions/upload-artifact@v7
        with:
          name: android-native-relink-sources
          path: dist/native-evidence/android/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-apks-${{ steps.build-config.outputs.label }}
          path: |
            android/app-*/build/outputs/apk/**/*.apk
            android/app-*/build/reports/
            android/*-dependencies.txt
            android/receiver-contracts/build/test-results/
            dist/reports/build-android.json
            .cache/ffmpeg-install-*/build-manifest.json
