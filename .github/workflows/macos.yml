name: macOS
on:
  push:
    branches: [main]
    paths: ["core/**","crates/**","Cargo.*","rust-toolchain.toml","scripts/check-architecture.py","scripts/architecture.py","build-config.json","scripts/build_config.py","scripts/tests/**","apple/**","scripts/apple_build.py","scripts/build-macos.py",".github/workflows/macos.yml"]
  pull_request:
    paths: ["core/**","crates/**","Cargo.*","rust-toolchain.toml","scripts/check-architecture.py","scripts/architecture.py","build-config.json","scripts/build_config.py","scripts/tests/**","apple/**","scripts/apple_build.py","scripts/build-macos.py",".github/workflows/macos.yml"]
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source branch, tag or commit (blank uses the selected workflow ref)'
        type: string
        default: ''
      version:
        description: 'Application major.minor.patch (blank uses build-config.json)'
        type: string
        default: ''
      build_number:
        description: 'Build number 1-65535 (blank uses build-config.json)'
        type: string
        default: ''
      configuration:
        description: 'Application build mode; Release outputs still require production signing'
        type: choice
        options: [Debug, Release]
        default: Release
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}-${{ github.event_name }}-${{ inputs.source_ref }}-${{ inputs.version }}-${{ inputs.build_number }}-${{ inputs.configuration }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Validate product version and record build inputs
        id: build-config
        env:
          LC_VERSION: ${{ inputs.version }}
          LC_BUILD_NUMBER: ${{ inputs.build_number }}
          LC_CONFIGURATION: ${{ inputs.configuration }}
        run: python scripts/build_config.py --platform macos --github
      - name: Test build input validation
        run: python -m unittest discover -s scripts/tests
      - run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/cache/restore@v4
        id: apple-cache
        with:
          key: apple-macos-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'scripts/apple_build.py') }}
          restore-keys: apple-macos-
          path: |
            target/
            ~/.cargo/registry/
            .cache/apple/webrtc.zip
            .cache/apple/xcodegen.zip
      - name: Build universal macOS app and run integration tests
        run: python3 scripts/build-macos.py
      - uses: actions/cache/save@v4
        if: always() && steps.apple-cache.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.apple-cache.outputs.cache-primary-key }}
          path: |
            target/
            ~/.cargo/registry/
            .cache/apple/webrtc.zip
            .cache/apple/xcodegen.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LanCast-Apple-macos-${{ steps.build-config.outputs.label }}
          path: |
            dist/apple/macos/
            apple/LanCast.xcodeproj/
            apple/Config/*-Info.plist
