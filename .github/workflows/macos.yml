name: macOS (sender + receiver)
on:
  push:
    branches: [main]
    paths: ["core/**","crates/**","Cargo.*","rust-toolchain.toml","scripts/check-architecture.py","scripts/architecture.py","build-config.json","scripts/build_config.py","scripts/tests/**","apple/**","scripts/apple_build.py","scripts/apple_products.py","scripts/verify-apple-artifacts.py","scripts/build-macos.py",".github/workflows/macos.yml"]
  pull_request:
    paths: ["core/**","crates/**","Cargo.*","rust-toolchain.toml","scripts/check-architecture.py","scripts/architecture.py","build-config.json","scripts/build_config.py","scripts/tests/**","apple/**","scripts/apple_build.py","scripts/apple_products.py","scripts/verify-apple-artifacts.py","scripts/build-macos.py",".github/workflows/macos.yml"]
  workflow_dispatch:
    inputs:
      source_ref:
        description: '源码版本（选填）：一般留空，使用上方所选分支；编译旧版时填标签或提交号'
        type: string
        default: ''
      version:
        description: '程序版本（选填）：例如 0.6.1；留空使用项目默认值，只填三段数字'
        type: string
        default: ''
      build_number:
        description: '更新序号（选填）：1–65535；留空使用项目默认值，覆盖升级 Android 时需增大'
        type: string
        default: ''
      configuration:
        description: '构建用途：日常使用选 Release，排查问题选 Debug；保留默认即可，不会自动发布'
        type: choice
        options: ['日常使用（Release）', '开发调试（Debug）']
        default: '日常使用（Release）'
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}-${{ github.event_name }}-${{ inputs.source_ref }}-${{ inputs.version }}-${{ inputs.build_number }}-${{ inputs.configuration }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Validate product version and record build inputs
        id: build-config
        env:
          LC_VERSION: ${{ inputs.version }}
          LC_BUILD_NUMBER: ${{ inputs.build_number }}
          LC_CONFIGURATION: ${{ inputs.configuration }}
        run: python scripts/build_config.py --platform macos --github
      - name: Test build input validation
        run: python -m unittest discover -s scripts/tests
      - run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/cache/restore@v6
        id: apple-cache
        with:
          key: apple-macos-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'scripts/apple_build.py') }}
          restore-keys: apple-macos-
          path: |
            target/
            ~/.cargo/registry/
            .cache/apple/webrtc.zip
            .cache/apple/xcodegen.zip
      - name: Build universal macOS sender and receiver app with integration tests
        run: python3 scripts/build-macos.py
      - name: Verify app identities targets and archive contents
        run: python3 scripts/verify-apple-artifacts.py "dist/apple/macos/${{ steps.build-config.outputs.label }}"
      - uses: actions/cache/save@v6
        if: always() && steps.apple-cache.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.apple-cache.outputs.cache-primary-key }}
          path: |
            target/
            ~/.cargo/registry/
            .cache/apple/webrtc.zip
            .cache/apple/xcodegen.zip
      - uses: actions/upload-artifact@v7
        with:
          name: LanCast-macOS-Sender-Receiver-${{ steps.build-config.outputs.label }}
          path: |
            dist/apple/macos/${{ steps.build-config.outputs.label }}/*.zip
            dist/apple/macos/${{ steps.build-config.outputs.label }}/*.txt
            dist/apple/macos/${{ steps.build-config.outputs.label }}/*.md
            dist/apple/macos/${{ steps.build-config.outputs.label }}/build-report.json
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: apple-macos-build-reports-${{ steps.build-config.outputs.label }}
          path: |
            dist/apple/macos/${{ steps.build-config.outputs.label }}/*.xcresult/
            dist/apple/macos/${{ steps.build-config.outputs.label }}/build-report.json
            apple/LanCast.xcodeproj/
            apple/Config/*-Info.plist
          compression-level: 9
