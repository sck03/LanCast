name: Linux core
on:
  push:
    branches: [main]
    paths: ["core/**","crates/**","Cargo.*","rust-toolchain.toml","scripts/check-architecture.py","scripts/architecture.py","scripts/tests/**","scripts/build_config.py","build-config.json","scripts/dependency-report.py",".github/workflows/core-linux.yml"]
  pull_request:
    paths: ["core/**","crates/**","Cargo.*","rust-toolchain.toml","scripts/check-architecture.py","scripts/architecture.py","scripts/tests/**","scripts/build_config.py","build-config.json","scripts/dependency-report.py",".github/workflows/core-linux.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v4
        with:
          key: rust-core-ubuntu-24.04-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'core/src/**', 'crates/**') }}
          restore-keys: rust-core-ubuntu-24.04-
          path: |
            target/
            ~/.cargo/registry/
      - run: python scripts/check-architecture.py
      - run: python -m unittest discover -s scripts/tests
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo check -p cast-ffi --no-default-features --locked
      - run: cargo check -p cast-ffi --no-default-features --features legacy --locked
      - run: python scripts/dependency-report.py
      - uses: actions/upload-artifact@v4
        with:
          name: dependencies-ubuntu-24.04
          path: dist/reports/
