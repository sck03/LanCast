[package]
name = "cast-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["sender"]
sender = ["file-sender", "dlna-live"]
file-sender = ["http-server"]
http-server = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:bytes"]
dlna = ["dep:reqwest", "dep:roxmltree"]
dlna-live = ["dlna", "file-sender"]
file-proxy = ["http-server", "dep:reqwest"]

[[example]]
name = "validate_live"
required-features = ["dlna-live"]

[[example]]
name = "validate_ts"
required-features = ["dlna-live"]

[dependencies]
cast-domain = { path = "../cast-domain" }
cast-core = { path = "../cast-core" }
anyhow = "1"
base64 = "0.22"
futures-util = "0.3"
hex = "0.4"
mdns-sd = "0.21.7"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand = "0.9"
rcgen = { version = "0.14", features = ["pem"] }
reqwest = { optional = true, version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
roxmltree = { version = "0.21", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "fs", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
hyper = { optional = true, version = "1", features = ["server", "http1"] }
hyper-util = { optional = true, version = "0.1", features = ["tokio"] }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
x509-parser = "0.18"
webpki-roots = "1"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
